[package]
name = "gitlab-tracker"
version = "0.1.0"
description = "GitLab Tracker menu bar app"
authors = ["Dusan Jankov"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitlab_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
thiserror = "2.0.21"
futures = "0.3.34"
sha2 = "0.11.1"
percent-encoding = "2.3.2"
keyring = { version = "3", features = ["apple-native"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
lru = "0.19.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "gzip"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
